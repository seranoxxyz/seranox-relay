name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Depends on @seranox/sdk via `file:../seranox-sdk` (sibling folder), so CI
    # checks the SDK out next to this repo and builds it first.
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          repository: seranoxxyz/seranox-sdk
          path: seranox-sdk
      - uses: pnpm/action-setup@v4 # pnpm version comes from packageManager (repo is checked out under main/)
        with:
          package_json_file: main/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build SDK
        working-directory: seranox-sdk
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
